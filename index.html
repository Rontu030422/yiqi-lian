<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        @keyframes yq-fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes yq-zoom-in { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes yq-slide-up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .a-fade-in { animation: yq-fade-in 0.25s ease-out; }
        .a-zoom-in { animation: yq-zoom-in 0.3s ease-out; }
        .a-slide-up { animation: yq-slide-up 0.3s ease-out; }
        @keyframes yq-pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.75; } }
        .a-pulse-soft { animation: yq-pulse-soft 2s infinite; }
        /* ===== 运动演示：2D 人物 SVG 骨骼动画 =====
           关节结构：外层 g 用 transform=translate 定位到关节轴心（静态），内层 g.j-anim 做 CSS 旋转；
           内层 g 内含不可见圆形稳定器（半径 ≥ 肢体最大摆幅），使 fill-box 包围盒恒为以轴心为圆心的圆，
           transform-origin: 50% 50% 即恒定锁定轴心，子关节弯曲时不漂移。 */
        .demo-wrap-svg { width: 148px; margin: 0 auto; position: relative; }
        .demo-svg { width: 100%; height: auto; display: block; overflow: visible; }
        .demo-svg .j-anim { transform-box: fill-box; transform-origin: 50% 50%; }
        .demo-svg .j-stab { opacity: 0; }
        /* 开合跳 */
        @keyframes svg-jj-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
        @keyframes svg-jj-shl { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(150deg); } }
        @keyframes svg-jj-shr { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-150deg); } }
        @keyframes svg-jj-hipl { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(30deg); } }
        @keyframes svg-jj-hipr { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-30deg); } }
        .demo-svg-jumping-jack .j-body { animation: svg-jj-bob 1s ease-in-out infinite; }
        .demo-svg-jumping-jack .j-shoulder-l { animation: svg-jj-shl 1s ease-in-out infinite; }
        .demo-svg-jumping-jack .j-shoulder-r { animation: svg-jj-shr 1s ease-in-out infinite; }
        .demo-svg-jumping-jack .j-hip-l { animation: svg-jj-hipl 1s ease-in-out infinite; }
        .demo-svg-jumping-jack .j-hip-r { animation: svg-jj-hipr 1s ease-in-out infinite; }
        /* 深蹲 */
        @keyframes svg-sq-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(36px); } }
        @keyframes svg-sq-hipl { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(22deg); } }
        @keyframes svg-sq-hipr { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-22deg); } }
        @keyframes svg-sq-kneel { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-38deg); } }
        @keyframes svg-sq-kneer { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(38deg); } }
        @keyframes svg-sq-shl { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(85deg); } }
        @keyframes svg-sq-shr { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-85deg); } }
        .demo-svg-squat .j-body { animation: svg-sq-bob 1.8s ease-in-out infinite; }
        .demo-svg-squat .j-hip-l { animation: svg-sq-hipl 1.8s ease-in-out infinite; }
        .demo-svg-squat .j-hip-r { animation: svg-sq-hipr 1.8s ease-in-out infinite; }
        .demo-svg-squat .j-knee-l { animation: svg-sq-kneel 1.8s ease-in-out infinite; }
        .demo-svg-squat .j-knee-r { animation: svg-sq-kneer 1.8s ease-in-out infinite; }
        .demo-svg-squat .j-shoulder-l { animation: svg-sq-shl 1.8s ease-in-out infinite; }
        .demo-svg-squat .j-shoulder-r { animation: svg-sq-shr 1.8s ease-in-out infinite; }
        /* 高抬腿 */
        @keyframes svg-hk-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes svg-hk-hipl { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(68deg); } }
        @keyframes svg-hk-hipr { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-68deg); } }
        @keyframes svg-hk-kneel { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-75deg); } }
        @keyframes svg-hk-kneer { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(75deg); } }
        @keyframes svg-hk-shl { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(25deg); } }
        @keyframes svg-hk-shr { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-25deg); } }
        .demo-svg-high-knee .j-body { animation: svg-hk-bob 0.7s ease-in-out infinite; }
        .demo-svg-high-knee .j-hip-l { animation: svg-hk-hipl 0.7s ease-in-out infinite; }
        .demo-svg-high-knee .j-hip-r { animation: svg-hk-hipr 0.7s ease-in-out infinite; animation-delay: -0.35s; }
        .demo-svg-high-knee .j-knee-l { animation: svg-hk-kneel 0.7s ease-in-out infinite; }
        .demo-svg-high-knee .j-knee-r { animation: svg-hk-kneer 0.7s ease-in-out infinite; animation-delay: -0.35s; }
        .demo-svg-high-knee .j-shoulder-l { animation: svg-hk-shl 0.7s ease-in-out infinite; animation-delay: -0.35s; }
        .demo-svg-high-knee .j-shoulder-r { animation: svg-hk-shr 0.7s ease-in-out infinite; }
        /* 慢跑 */
        @keyframes svg-jog-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
        @keyframes svg-jog-hipl { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(26deg); } }
        @keyframes svg-jog-hipr { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-26deg); } }
        @keyframes svg-jog-kneel { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(-28deg); } }
        @keyframes svg-jog-kneer { 0%,100% { transform: rotate(5deg); } 50% { transform: rotate(28deg); } }
        @keyframes svg-jog-shl { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-24deg); } }
        @keyframes svg-jog-shr { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(24deg); } }
        @keyframes svg-jog-elbl { 0%,100% { transform: rotate(-35deg); } 50% { transform: rotate(-50deg); } }
        @keyframes svg-jog-elbr { 0%,100% { transform: rotate(35deg); } 50% { transform: rotate(50deg); } }
        .demo-svg-jog .j-body { animation: svg-jog-bob 0.9s ease-in-out infinite; }
        .demo-svg-jog .j-hip-l { animation: svg-jog-hipl 0.9s ease-in-out infinite; }
        .demo-svg-jog .j-hip-r { animation: svg-jog-hipr 0.9s ease-in-out infinite; animation-delay: -0.45s; }
        .demo-svg-jog .j-knee-l { animation: svg-jog-kneel 0.9s ease-in-out infinite; }
        .demo-svg-jog .j-knee-r { animation: svg-jog-kneer 0.9s ease-in-out infinite; animation-delay: -0.45s; }
        .demo-svg-jog .j-shoulder-l { animation: svg-jog-shl 0.9s ease-in-out infinite; animation-delay: -0.45s; }
        .demo-svg-jog .j-shoulder-r { animation: svg-jog-shr 0.9s ease-in-out infinite; }
        .demo-svg-jog .j-elbow-l { animation: svg-jog-elbl 0.9s ease-in-out infinite; animation-delay: -0.45s; }
        .demo-svg-jog .j-elbow-r { animation: svg-jog-elbr 0.9s ease-in-out infinite; }
        /* 快跑 */
        @keyframes svg-sp-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
        @keyframes svg-sp-hipl { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(42deg); } }
        @keyframes svg-sp-hipr { 0%,100% { transform: rotate(15deg); } 50% { transform: rotate(-42deg); } }
        @keyframes svg-sp-kneel { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(-45deg); } }
        @keyframes svg-sp-kneer { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(45deg); } }
        @keyframes svg-sp-shl { 0%,100% { transform: rotate(12deg); } 50% { transform: rotate(-38deg); } }
        @keyframes svg-sp-shr { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(38deg); } }
        @keyframes svg-sp-elbl { 0%,100% { transform: rotate(-50deg); } 50% { transform: rotate(-70deg); } }
        @keyframes svg-sp-elbr { 0%,100% { transform: rotate(50deg); } 50% { transform: rotate(70deg); } }
        .demo-svg-sprint .j-body { animation: svg-sp-bob 0.5s ease-in-out infinite; }
        .demo-svg-sprint .j-hip-l { animation: svg-sp-hipl 0.5s ease-in-out infinite; }
        .demo-svg-sprint .j-hip-r { animation: svg-sp-hipr 0.5s ease-in-out infinite; animation-delay: -0.25s; }
        .demo-svg-sprint .j-knee-l { animation: svg-sp-kneel 0.5s ease-in-out infinite; }
        .demo-svg-sprint .j-knee-r { animation: svg-sp-kneer 0.5s ease-in-out infinite; animation-delay: -0.25s; }
        .demo-svg-sprint .j-shoulder-l { animation: svg-sp-shl 0.5s ease-in-out infinite; animation-delay: -0.25s; }
        .demo-svg-sprint .j-shoulder-r { animation: svg-sp-shr 0.5s ease-in-out infinite; }
        .demo-svg-sprint .j-elbow-l { animation: svg-sp-elbl 0.5s ease-in-out infinite; animation-delay: -0.25s; }
        .demo-svg-sprint .j-elbow-r { animation: svg-sp-elbr 0.5s ease-in-out infinite; }
        @media (prefers-reduced-motion: reduce) { .demo-svg .j-anim, .demo-svg .j-body { animation: none !important; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /*__PURE_START__*/
        // ===== 纯函数区（无 DOM / 无 JSX，可被 node 直接抽取测试）=====
        function fmtTime(mins) {
          var h = Math.floor(mins / 60), m = mins % 60;
          return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
        }
        function todayStr(d) {
          d = d || new Date();
          var m = d.getMonth() + 1, day = d.getDate();
          return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
        }
        function nowHM(d) {
          d = d || new Date();
          var h = d.getHours(), m = d.getMinutes();
          return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
        }
        function parseDate(s) {
          var p = s.split('-');
          return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10), 12, 0, 0);
        }
        function addDaysStr(dateStr, n) {
          var d = parseDate(dateStr);
          d.setDate(d.getDate() + n);
          return todayStr(d);
        }
        // 每天生成 3 个提醒时间。约束（由窗口设计天然保证，无需重试）：
        //  - 绝不落在 11:30–14:30（即 [690, 870) 分钟区间）
        //  - 任意两个提醒间隔 ≥ 90 分钟
        //  - 每天恰好 3 个
        // 窗口：早 [420,690)=07:00–11:29，午 [870,1080)=14:30–17:59，晚 [1170,1320)=19:30–21:59
        // 最小间隔：870-689=181，1170-1079=91，均 ≥ 90。
        function generateReminderTimes(rand) {
          if (typeof rand !== 'function') rand = Math.random;
          var pick = function (lo, hi) { return lo + Math.floor(rand() * (hi - lo)); };
          var t1 = pick(420, 690);
          var t2 = pick(870, 1080);
          var t3 = pick(1170, 1320);
          return [t1, t2, t3].map(fmtTime);
        }
        // 最近 7 天（含 refDate 当天）的完成次数
        function weekCount(records, refDateStr) {
          var from = addDaysStr(refDateStr, -6);
          var n = 0;
          for (var i = 0; i < records.length; i++) {
            var d = records[i].date;
            if (d >= from && d <= refDateStr) n++;
          }
          return n;
        }
        // 连续运动天数：从 refDate（当天无记录则从昨天）往前数连续有记录的天数
        function streakDays(records, refDateStr) {
          var set = {};
          for (var i = 0; i < records.length; i++) set[records[i].date] = true;
          var cur = refDateStr;
          if (!set[cur]) cur = addDaysStr(cur, -1);
          var n = 0;
          while (set[cur]) { n++; cur = addDaysStr(cur, -1); }
          return n;
        }
        // 当天计划中下一个还没到的提醒；没有则返回 null
        function nextReminder(times, hm) {
          for (var i = 0; i < times.length; i++) {
            if (times[i] > hm) return times[i];
          }
          return null;
        }
        /*__PURE_END__*/

        // ===== 数据层（localStorage，带版本号；模块化预留未来扩展）=====
        const DB_PREFIX = 'yiqilian.v1.';
        const Store = {
          get(key, fallback) {
            try {
              const raw = localStorage.getItem(DB_PREFIX + key);
              return raw == null ? fallback : JSON.parse(raw);
            } catch (e) { return fallback; }
          },
          set(key, val) {
            try { localStorage.setItem(DB_PREFIX + key, JSON.stringify(val)); } catch (e) {}
          },
        };

        // -- user：账号系统 stub，1.0 只用本地昵称 --
        const User = {
          current() { return Store.get('user', { nickname: '我' }); },
          // 未来：login(), logout(), sync()
        };
        // -- relationship：好友/家人关系 stub --
        const Relationship = {
          list() { return []; },
          // 未来：addFriend(), removeFriend(), familyCircle()
        };
        // -- message：一对一/群组消息 stub --
        const Message = {
          list() { return []; },
          // 未来：send(), history()
        };

        // -- exercises：运动项目 --
        const EXERCISES = [
          { id: 'jumping-jack', name: '开合跳', kind: 'reps',  target: 10, unit: '次', emoji: '🤸' },
          { id: 'squat',        name: '深蹲',   kind: 'reps',  target: 10, unit: '次', emoji: '🏋️' },
          { id: 'high-knee',    name: '高抬腿', kind: 'reps',  target: 30, unit: '次', emoji: '🦵' },
          { id: 'jog',          name: '慢跑',   kind: 'timer', seconds: 900, label: '15 分钟', emoji: '🏃' },
          { id: 'sprint',       name: '快跑',   kind: 'sets',  seconds: 60, sets: 3, label: '1 分钟 × 3 组', emoji: '⚡' },
        ];
        const ExerciseStore = {
          all() { return EXERCISES; },
          get(id) { return EXERCISES.find(e => e.id === id); },
        };

        // -- records：完成记录 {date, time, exerciseId, name} --
        const RecordStore = {
          all() { return Store.get('records', []); },
          add(rec) {
            let rs = Store.get('records', []);
            rs.push(rec);
            const cutoff = addDaysStr(todayStr(), -120); // 只保留 120 天
            rs = rs.filter(r => r.date >= cutoff);
            Store.set('records', rs);
            return rs;
          },
          ofDate(dateStr) { return Store.get('records', []).filter(r => r.date === dateStr); },
        };

        // -- settings --
        const SettingsStore = {
          get() { return Object.assign({ remindersEnabled: true, vibration: true }, Store.get('settings', {})); },
          set(patch) { Store.set('settings', Object.assign(this.get(), patch)); },
        };

        // -- reminders：当日提醒计划 --
        const Reminder = {
          ensureTodayPlan() {
            const today = todayStr();
            let plan = Store.get('reminders', null);
            if (!plan || plan.date !== today) {
              plan = { date: today, times: generateReminderTimes() };
              Store.set('reminders', plan);
              Store.set('fired', { date: today, times: [] });
            }
            return plan;
          },
          firedTimes() {
            const f = Store.get('fired', null);
            const today = todayStr();
            return (f && f.date === today) ? f.times : [];
          },
          markFired(t) {
            const today = todayStr();
            let f = Store.get('fired', null);
            if (!f || f.date !== today) f = { date: today, times: [] };
            if (f.times.indexOf(t) < 0) f.times.push(t);
            Store.set('fired', f);
          },
        };

        function vibrate(pattern) {
          try {
            if (SettingsStore.get().vibration && navigator.vibrate) navigator.vibrate(pattern);
          } catch (e) {}
        }

        // ===== 提醒触发（in-page 可靠路径）=====
        // 页面打开时每 30 秒检查一次：到点 → 震动 + 站内横幅 + 系统通知（若已授权）
        function fireReminderUI(timeStr, showBanner) {
          vibrate([200, 100, 200]);
          showBanner('该运动啦 💪（' + timeStr + ' 提醒）');
          try {
            if ('Notification' in window && Notification.permission === 'granted') {
              new Notification('一起练 · 该运动啦 💪', {
                body: '起来动一动，今天的运动等你完成',
                icon: './icon-192.png',
                tag: 'yiqilian-inpage-' + timeStr,
              });
            }
          } catch (e) {}
        }

        function requestNotificationPermission() {
          try {
            if (!('Notification' in window)) return Promise.resolve('unsupported');
            if (Notification.permission === 'granted') return Promise.resolve('granted');
            return Notification.requestPermission();
          } catch (e) { return Promise.resolve('error'); }
        }

        // ===== UI 组件 =====
        function BottomNav({ view, setView }) {
          const items = [
            { id: 'home', label: '首页', icon: '🏠' },
            { id: 'records', label: '我的记录', icon: '📊' },
            { id: 'settings', label: '设置', icon: '⚙️' },
          ];
          return (
            <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 safe-area-bottom z-40">
              <div className="flex">
                {items.map(it => (
                  <button
                    key={it.id}
                    onClick={() => setView(it.id)}
                    className={'flex-1 py-3 text-center active:scale-95 transition ' + (view === it.id ? 'text-orange-500' : 'text-gray-400')}
                  >
                    <div className="text-2xl leading-none">{it.icon}</div>
                    <div className="text-xs font-bold mt-1">{it.label}</div>
                  </button>
                ))}
              </div>
            </nav>
          );
        }

        function HomeView({ setView, banner }) {
          const [tick, setTick] = useState(0);
          useEffect(() => {
            const id = setInterval(() => setTick(t => t + 1), 30000);
            return () => clearInterval(id);
          }, []);
          const today = todayStr();
          const todayRecords = RecordStore.ofDate(today);
          const settings = SettingsStore.get();
          const plan = settings.remindersEnabled ? Reminder.ensureTodayPlan() : null;
          const next = plan ? nextReminder(plan.times, nowHM()) : null;

          return (
            <div className="a-fade-in pb-28">
              {banner && (
                <div className="mx-4 mt-4 bg-orange-500 text-white rounded-2xl px-4 py-3 font-bold shadow-lg a-slide-up">
                  {banner}
                </div>
              )}
              <div className="px-5 pt-8">
                <p className="text-gray-500 font-medium">今天也要动起来 👊</p>
                <h1 className="text-3xl font-black mt-1">一起练</h1>
              </div>

              <div className="mx-4 mt-5 bg-white rounded-3xl p-6 shadow-xl border border-gray-100 text-center a-zoom-in">
                <p className="text-gray-500 font-medium">今天完成</p>
                <p className="text-5xl font-black mt-2 tabular-nums">
                  {todayRecords.length}<span className="text-2xl text-gray-400"> / 3</span>
                </p>
                <div className="mt-4 h-3 bg-gray-100 rounded-full overflow-hidden">
                  <div className="h-full bg-orange-500 rounded-full transition-all" style={{ width: Math.min(100, (todayRecords.length / 3) * 100) + '%' }}></div>
                </div>
                <p className="mt-4 text-sm text-gray-500">
                  {settings.remindersEnabled
                    ? (next ? <>下一次提醒：<span className="font-black text-gray-800 text-base">{next}</span></> : '今日提醒已结束，明天继续 💪')
                    : '运动提醒已关闭，可在设置中开启'}
                </p>
                <button
                  onClick={() => { vibrate(50); setView('pick'); }}
                  className="mt-5 w-full bg-black text-white py-5 rounded-2xl text-xl font-bold shadow-lg active:scale-95 transition-transform"
                >
                  完成运动
                </button>
              </div>

              <div className="mx-4 mt-5">
                <h2 className="font-black text-lg mb-2 px-1">今天的运动记录</h2>
                {todayRecords.length === 0 ? (
                  <p className="text-gray-400 text-sm px-1">还没有记录，快去完成第一次吧！</p>
                ) : (
                  <div className="space-y-2">
                    {todayRecords.slice().reverse().map((r, i) => (
                      <div key={i} className="bg-white rounded-2xl px-4 py-3 shadow border border-gray-100 flex items-center justify-between a-fade-in">
                        <span className="font-bold">{r.name}</span>
                        <span className="text-sm text-gray-400 tabular-nums">{r.time}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          );
        }

        function PickView({ setView, onPick }) {
          return (
            <div className="a-fade-in pb-28 px-5 pt-8">
              <button onClick={() => setView('home')} className="text-gray-500 font-bold mb-4 active:scale-95">← 返回</button>
              <h1 className="text-2xl font-black mb-1">选择运动</h1>
              <p className="text-gray-500 text-sm mb-5">选一个，马上开始</p>
              <div className="space-y-3">
                {ExerciseStore.all().map(ex => (
                  <button
                    key={ex.id}
                    onClick={() => { vibrate(50); onPick(ex); }}
                    className="w-full bg-white rounded-3xl p-5 shadow border border-gray-100 flex items-center active:scale-95 transition-transform text-left"
                  >
                    <span className="text-4xl mr-4">{ex.emoji}</span>
                    <span className="flex-1">
                      <span className="block text-lg font-black">{ex.name}</span>
                      <span className="block text-sm text-gray-500 mt-0.5">{ex.kind === 'reps' ? ex.target + ' ' + ex.unit : ex.label}</span>
                    </span>
                    <span className="text-gray-300 text-2xl">›</span>
                  </button>
                ))}
              </div>
            </div>
          );
        }

        // ===== 运动演示：2D 人物 SVG（肩/肘/髋/膝四关节，双节肢体），按 exerciseId 切换动作 =====
        function ExerciseDemo({ exerciseId }) {
          const skin = '#f6c391', hair = '#374151', top = '#f97316', topDark = '#dd6a17', pants = '#1f2937';
          const leg = (side) => (
            <g transform={'translate(' + (side === 'l' ? 61 : 79) + ',128)'}>
              <g className={'j-anim ' + (side === 'l' ? 'j-hip-l' : 'j-hip-r')}>
                <circle cx="0" cy="0" r="105" className="j-stab" fill="#000" opacity="0"/>
                <rect x="-8.5" y="0" width="17" height="42" rx="8.5" fill={skin}/>
                <g transform="translate(0,42)">
                  <g className={'j-anim ' + (side === 'l' ? 'j-knee-l' : 'j-knee-r')}>
                    <circle cx="0" cy="0" r="60" className="j-stab" fill="#000" opacity="0"/>
                    <rect x="-7" y="0" width="14" height="38" rx="7" fill={skin}/>
                    <rect x="-11" y="34" width="26" height="14" rx="7" fill="#ffffff"/>
                    <rect x="-11" y="43" width="26" height="5" rx="2.5" fill={top}/>
                  </g>
                </g>
              </g>
            </g>
          );
          const arm = (side) => (
            <g transform={'translate(' + (side === 'l' ? 52 : 88) + ',62)'}>
              <g className={'j-anim ' + (side === 'l' ? 'j-shoulder-l' : 'j-shoulder-r')}>
                <circle cx="0" cy="0" r="85" className="j-stab" fill="#000" opacity="0"/>
                <rect x="-9" y="-2" width="18" height="14" rx="7" fill={topDark}/>
                <rect x="-7.5" y="0" width="15" height="36" rx="7.5" fill={skin}/>
                <g transform="translate(0,36)">
                  <g className={'j-anim ' + (side === 'l' ? 'j-elbow-l' : 'j-elbow-r')}>
                    <circle cx="0" cy="0" r="45" className="j-stab" fill="#000" opacity="0"/>
                    <rect x="-6.5" y="0" width="13" height="30" rx="6.5" fill={skin}/>
                    <circle cx="0" cy="34" r="7.5" fill={skin}/>
                  </g>
                </g>
              </g>
            </g>
          );
          return (
            <div className="demo-wrap-svg">
              <svg viewBox="0 0 140 230" className={'demo-svg demo-svg-' + exerciseId}>
                <ellipse cx="70" cy="220" rx="44" ry="7" fill={top} opacity="0.15"/>
                <g className="j-body">
                  {leg('l')}
                  {leg('r')}
                  <path d="M53 100 L87 100 L91 130 L78 130 L70 114 L62 130 L49 130 Z" fill={pants}/>
                  <rect x="64" y="38" width="12" height="14" rx="5" fill={skin}/>
                  <path d="M50 58 Q70 48 90 58 L84 104 Q70 109 56 104 Z" fill={top}/>
                  <path d="M50 58 Q70 48 90 58 L89 66 Q70 57 51 66 Z" fill={topDark} opacity="0.6"/>
                  {arm('l')}
                  {arm('r')}
                  <g className="j-head">
                    <circle cx="70" cy="26" r="15" fill={skin}/>
                    <path d="M55 27 Q54 11 70 11 Q86 11 85 27 Q80 17 74 19 Q70 21 66 19 Q60 17 55 27 Z" fill={hair}/>
                  </g>
                </g>
              </svg>
            </div>
          );
        }

        function DoingView({ exercise, setView, onDone }) {
          const [timeLeft, setTimeLeft] = useState(exercise.seconds || 0);
          const [setIdx, setSetIdx] = useState(0); // 快跑：第几组（0-based）
          const totalSets = exercise.kind === 'sets' ? exercise.sets : 1;

          useEffect(() => {
            if (exercise.kind === 'reps') return;
            setTimeLeft(exercise.seconds);
            setSetIdx(0);
            setStarted(false);
          }, [exercise.id]);

          useEffect(() => {
            if (exercise.kind === 'reps') return;
            if (!started) return;
            if (timeLeft <= 0) {
              if (setIdx + 1 < totalSets) {
                vibrate([150, 100, 150]);
                setSetIdx(s => s + 1);
                setTimeLeft(exercise.seconds);
              } else {
                onDone();
              }
              return;
            }
            const timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
            if (timeLeft <= 3) vibrate(100);
            return () => clearInterval(timer);
          }, [timeLeft, setIdx, started, exercise.id]);

          const startExercise = () => { vibrate(50); setTimeLeft(exercise.seconds); setSetIdx(0); };
          const [started, setStarted] = useState(exercise.kind === 'reps' ? true : false);
          const begin = () => { setStarted(true); startExercise(); };

          const mm = Math.floor(Math.max(0, timeLeft) / 60);
          const ss = Math.max(0, timeLeft) % 60;
          const clock = (mm > 0 ? mm + ':' + (ss < 10 ? '0' : '') + ss : '' + ss);

          // --- 次数类：展示目标 + 大"完成"按钮 ---
          if (exercise.kind === 'reps') {
            return (
              <div className="a-fade-in pb-28 px-5 pt-8">
                <button onClick={() => setView('pick')} className="text-gray-500 font-bold mb-4">← 返回</button>
                <div className="bg-white rounded-3xl p-8 shadow-xl border border-gray-100 text-center a-zoom-in">
                  <ExerciseDemo exerciseId={exercise.id} />
                  <h1 className="text-3xl font-black mt-4">{exercise.name} <span className="text-2xl">{exercise.emoji}</span></h1>
                  <p className="text-gray-500 font-medium mt-2">目标：<span className="text-orange-500 font-black text-xl">{exercise.target} {exercise.unit}</span></p>
                  <p className="text-sm text-gray-400 mt-4">按你的节奏完成，做完点下面的按钮</p>
                  <button
                    onClick={() => { vibrate([200, 100, 200]); onDone(); }}
                    className="mt-6 w-full bg-orange-500 text-white py-5 rounded-2xl text-xl font-bold shadow-lg active:scale-95 transition-transform"
                  >
                    完成！
                  </button>
                </div>
              </div>
            );
          }

          // --- 计时 / 组数类 ---
          return (
            <div className="a-fade-in h-screen flex flex-col items-center justify-between py-16 px-6">
              <div className="text-center">
                <ExerciseDemo exerciseId={exercise.id} />
                <h2 className="text-2xl font-bold text-gray-400 mt-3">{exercise.name} {exercise.emoji}</h2>
                {exercise.kind === 'sets' && (
                  <p className="mt-2 inline-block bg-orange-100 text-orange-600 font-black px-4 py-1 rounded-full">
                    第 {setIdx + 1} / {totalSets} 组
                  </p>
                )}
                {!started ? (
                  <div className="mt-8">
                    <p className="text-gray-500 mb-6">{exercise.label}，准备好了就开始</p>
                    <button onClick={begin} className="bg-black text-white px-12 py-5 rounded-2xl text-xl font-bold shadow-lg active:scale-95 transition-transform">
                      开始
                    </button>
                  </div>
                ) : (
                  <div className="text-8xl font-black tabular-nums tracking-tighter mt-4 a-pulse-soft">
                    {clock}
                    {mm > 0 && <span className="text-3xl ml-2 text-gray-400">min</span>}
                    {mm === 0 && <span className="text-3xl ml-2 text-gray-400">s</span>}
                  </div>
                )}
              </div>
              {started && (
                <div className="w-full px-4">
                  <div className="h-4 w-full bg-gray-200 rounded-full overflow-hidden">
                    <div className="h-full bg-orange-500 transition-all duration-1000 ease-linear"
                         style={{ width: (Math.max(0, timeLeft) / exercise.seconds) * 100 + '%' }}></div>
                  </div>
                  {exercise.kind === 'sets' && (
                    <div className="flex justify-center gap-2 mt-4">
                      {Array.from({ length: totalSets }).map((_, i) => (
                        <div key={i} className={'w-3 h-3 rounded-full ' + (i < setIdx ? 'bg-orange-500' : (i === setIdx ? 'bg-orange-300 a-pulse-soft' : 'bg-gray-200'))}></div>
                      ))}
                    </div>
                  )}
                </div>
              )}
              <button onClick={() => setView('pick')} className="text-gray-400 font-medium">放弃本次</button>
            </div>
          );
        }

        function CompletedView({ stats, setView }) {
          return (
            <div className="a-fade-in pb-28 px-5 pt-12">
              <div className="w-full max-w-sm mx-auto space-y-4">
                <div className="bg-green-500 rounded-3xl p-8 text-white text-center shadow-2xl a-zoom-in">
                  <div className="text-6xl mb-4">🏆</div>
                  <h2 className="text-3xl font-black mb-2">完成了！</h2>
                  <p className="opacity-90 font-medium text-lg">你今天已经赢了 {stats.today} 次</p>
                </div>
                <div className="bg-white rounded-3xl p-6 shadow-xl border border-gray-100 a-slide-up">
                  <div className="flex text-center">
                    <div className="flex-1">
                      <p className="text-2xl font-black tabular-nums">{stats.today}<span className="text-sm text-gray-400">/3</span></p>
                      <p className="text-xs text-gray-500 mt-1">今日</p>
                    </div>
                    <div className="flex-1 border-x border-gray-100">
                      <p className="text-2xl font-black tabular-nums">{stats.week}</p>
                      <p className="text-xs text-gray-500 mt-1">本周次数</p>
                    </div>
                    <div className="flex-1">
                      <p className="text-2xl font-black tabular-nums">{stats.streak}<span className="text-sm text-gray-400">天</span></p>
                      <p className="text-xs text-gray-500 mt-1">连续运动</p>
                    </div>
                  </div>
                </div>
                <button
                  onClick={() => setView('home')}
                  className="w-full bg-black text-white py-4 rounded-2xl text-lg font-bold shadow active:scale-95 transition-transform"
                >
                  返回首页
                </button>
              </div>
            </div>
          );
        }

        function RecordsView({ setView }) {
          const records = RecordStore.all().slice().reverse();
          const today = todayStr();
          const week = weekCount(RecordStore.all(), today);
          const streak = streakDays(RecordStore.all(), today);
          const groups = {};
          records.forEach(r => { (groups[r.date] = groups[r.date] || []).push(r); });
          const dates = Object.keys(groups).sort().reverse();

          return (
            <div className="a-fade-in pb-28 px-5 pt-8">
              <h1 className="text-2xl font-black mb-5">我的记录</h1>
              <div className="grid grid-cols-2 gap-3 mb-6">
                <div className="bg-white rounded-3xl p-5 shadow border border-gray-100 text-center">
                  <p className="text-3xl font-black tabular-nums">{week}</p>
                  <p className="text-xs text-gray-500 mt-1">本周完成（次）</p>
                </div>
                <div className="bg-white rounded-3xl p-5 shadow border border-gray-100 text-center">
                  <p className="text-3xl font-black tabular-nums">{streak}<span className="text-base text-gray-400">天</span></p>
                  <p className="text-xs text-gray-500 mt-1">连续运动</p>
                </div>
              </div>
              {dates.length === 0 ? (
                <p className="text-gray-400 text-sm">还没有运动记录，去首页完成第一次吧！</p>
              ) : dates.map(d => (
                <div key={d} className="mb-4">
                  <p className="text-sm font-bold text-gray-500 mb-2 px-1">{d === today ? '今天' : d}</p>
                  <div className="space-y-2">
                    {groups[d].map((r, i) => (
                      <div key={i} className="bg-white rounded-2xl px-4 py-3 shadow border border-gray-100 flex items-center justify-between">
                        <span className="font-bold">{r.name}</span>
                        <span className="text-sm text-gray-400 tabular-nums">{r.time}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          );
        }

        function SettingsView({ setView, refreshKey }) {
          const [settings, setSettings] = useState(SettingsStore.get());
          const [notifState, setNotifState] = useState(('Notification' in window) ? Notification.permission : 'unsupported');
          const [canInstall, setCanInstall] = useState(false);
          const installPrompt = useRef(null);

          useEffect(() => {
            const handler = (e) => { e.preventDefault(); installPrompt.current = e; setCanInstall(true); };
            window.addEventListener('beforeinstallprompt', handler);
            return () => window.removeEventListener('beforeinstallprompt', handler);
          }, []);

          const toggle = (key) => {
            const next = Object.assign({}, settings, { [key]: !settings[key] });
            SettingsStore.set(next);
            setSettings(next);
            if (key === 'remindersEnabled') pushPlanToSW();
          };

          const enableNotif = () => {
            requestNotificationPermission().then(p => {
              setNotifState(p);
              if (p === 'granted') fireReminderUI(nowHM(), () => {});
            });
          };

          const doInstall = () => {
            if (installPrompt.current) {
              installPrompt.current.prompt();
              installPrompt.current.userChoice.then(() => { installPrompt.current = null; setCanInstall(false); });
            }
          };

          const plan = settings.remindersEnabled ? Reminder.ensureTodayPlan() : null;

          return (
            <div className="a-fade-in pb-28 px-5 pt-8">
              <h1 className="text-2xl font-black mb-5">设置</h1>

              <div className="bg-white rounded-3xl shadow border border-gray-100 divide-y divide-gray-100 mb-4">
                <div className="px-5 py-4 flex items-center justify-between">
                  <div>
                    <p className="font-bold">运动提醒</p>
                    <p className="text-xs text-gray-400 mt-0.5">每天 3 次，11:30–14:30 不打扰</p>
                  </div>
                  <button onClick={() => toggle('remindersEnabled')}
                    className={'w-14 h-8 rounded-full transition ' + (settings.remindersEnabled ? 'bg-green-500' : 'bg-gray-300')}>
                    <span className={'block w-6 h-6 bg-white rounded-full shadow transition-all mt-1 ' + (settings.remindersEnabled ? 'ml-7' : 'ml-1')}></span>
                  </button>
                </div>
                <div className="px-5 py-4 flex items-center justify-between">
                  <div>
                    <p className="font-bold">震动</p>
                    <p className="text-xs text-gray-400 mt-0.5">提醒和完成时震动（默认开）</p>
                  </div>
                  <button onClick={() => toggle('vibration')}
                    className={'w-14 h-8 rounded-full transition ' + (settings.vibration ? 'bg-green-500' : 'bg-gray-300')}>
                    <span className={'block w-6 h-6 bg-white rounded-full shadow transition-all mt-1 ' + (settings.vibration ? 'ml-7' : 'ml-1')}></span>
                  </button>
                </div>
                {plan && (
                  <div className="px-5 py-4">
                    <p className="font-bold mb-2">今日提醒时间</p>
                    <div className="flex gap-2">
                      {plan.times.map(t => (
                        <span key={t} className="bg-orange-50 text-orange-600 font-black px-3 py-1.5 rounded-xl tabular-nums">{t}</span>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              <div className="bg-white rounded-3xl shadow border border-gray-100 divide-y divide-gray-100 mb-4">
                <div className="px-5 py-4">
                  <p className="font-bold mb-1">系统通知</p>
                  <p className="text-xs text-gray-400 mb-3">
                    {notifState === 'granted' ? '已开启：App 在后台时也能收到提醒' : '开启后，即使 App 不在前台也能收到提醒（尽力而为）'}
                  </p>
                  {notifState !== 'granted' && notifState !== 'unsupported' && (
                    <button onClick={enableNotif} className="w-full bg-orange-500 text-white py-3 rounded-2xl font-bold active:scale-95 transition-transform">
                      开启系统通知
                    </button>
                  )}
                  {notifState === 'granted' && (
                    <button onClick={() => requestNotificationPermission().then(() => fireReminderUI('测试', () => {}))}
                      className="w-full bg-gray-100 text-gray-700 py-3 rounded-2xl font-bold active:scale-95 transition-transform">
                      发送一条测试提醒
                    </button>
                  )}
                </div>
                {canInstall && (
                  <div className="px-5 py-4">
                    <p className="font-bold mb-1">安装到主屏幕</p>
                    <p className="text-xs text-gray-400 mb-3">像 App 一样打开，提醒更可靠</p>
                    <button onClick={doInstall} className="w-full bg-black text-white py-3 rounded-2xl font-bold active:scale-95 transition-transform">
                      安装一起练
                    </button>
                  </div>
                )}
              </div>

              <p className="text-center text-xs text-gray-400 mt-6">一起练 1.0 · 数据只保存在本机浏览器</p>
            </div>
          );
        }

        function App() {
          const [view, setView] = useState('home');
          const [picked, setPicked] = useState(null);
          const [stats, setStats] = useState({ today: 0, week: 0, streak: 0 });
          const [banner, setBanner] = useState('');
          const bannerTimer = useRef(null);

          const showBanner = (msg) => {
            setBanner(msg);
            if (bannerTimer.current) clearTimeout(bannerTimer.current);
            bannerTimer.current = setTimeout(() => setBanner(''), 8000);
          };

          // 应用启动：生成当日提醒计划，并同步给 SW
          useEffect(() => {
            const s = SettingsStore.get();
            if (s.remindersEnabled) {
              Reminder.ensureTodayPlan();
              pushPlanToSW();
            }
          }, []);

          // in-page 提醒检查：每 30 秒
          useEffect(() => {
            const check = () => {
              const s = SettingsStore.get();
              if (!s.remindersEnabled) return;
              const plan = Reminder.ensureTodayPlan();
              const hm = nowHM();
              const fired = Reminder.firedTimes();
              plan.times.forEach(t => {
                if (fired.indexOf(t) < 0 && hm >= t) {
                  Reminder.markFired(t);
                  fireReminderUI(t, showBanner);
                }
              });
            };
            check();
            const id = setInterval(check, 30000);
            return () => clearInterval(id);
          }, []);

          const completeExercise = (ex) => {
            const rec = { date: todayStr(), time: nowHM(), exerciseId: ex.id, name: ex.name };
            const all = RecordStore.add(rec);
            vibrate([200, 100, 200]);
            setStats({
              today: RecordStore.ofDate(todayStr()).length,
              week: weekCount(all, todayStr()),
              streak: streakDays(all, todayStr()),
            });
            setView('completed');
          };

          return (
            <div className="max-w-md mx-auto min-h-screen relative">
              {view === 'home' && <HomeView setView={setView} banner={banner} />}
              {view === 'pick' && <PickView setView={setView} onPick={(ex) => { setPicked(ex); setView('doing'); }} />}
              {view === 'doing' && picked && (
                <DoingView exercise={picked} setView={setView} onDone={() => completeExercise(picked)} />
              )}
              {view === 'completed' && <CompletedView stats={stats} setView={setView} />}
              {view === 'records' && <RecordsView setView={setView} />}
              {view === 'settings' && <SettingsView setView={setView} />}
              {(view === 'home' || view === 'records' || view === 'settings') && (
                <BottomNav view={view} setView={setView} />
              )}
            </div>
          );
        }

        function pushPlanToSW() {
          try {
            if (!('serviceWorker' in navigator)) return;
            const send = () => {
              if (!navigator.serviceWorker.controller) return;
              const s = SettingsStore.get();
              if (s.remindersEnabled) {
                const plan = Reminder.ensureTodayPlan();
                navigator.serviceWorker.controller.postMessage({ type: 'SET_REMINDERS', date: plan.date, times: plan.times });
              } else {
                navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_REMINDERS' });
              }
            };
            send();
            setTimeout(send, 1500);
          } catch (e) {}
        }

        // SW 注册
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(() => {
              pushPlanToSW();
              navigator.serviceWorker.addEventListener('controllerchange', pushPlanToSW);
            }).catch(() => {});
          });
          // SW 尽力路径触发了提醒 → 标记已触发，避免 in-page 重复
          navigator.serviceWorker.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'REMINDER_FIRED') Reminder.markFired(e.data.time);
          });
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
